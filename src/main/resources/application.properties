spring.application.name=ems-backend

#To access local MySQL server
spring.datasource.url=jdbc:mysql://localhost:3307/ems
spring.datasource.username=root
spring.datasource.password=pass123

#JPA is Connected with mySQL database (Hibernate Properties)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#Update the table in the database whenever application is run (Hibernate Properties)
spring.jpa.hibernate.ddl-auto=update
