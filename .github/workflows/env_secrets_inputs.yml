name: Demo CI Env Secrets

on:
  push:
    branches: [ "dev" ]

  workflow_dispatch:
        
env:
    GLOBAL_APP_ENV: global-dev # Applicable for all jobs

jobs:
    build:
        runs-on: ubuntu-latest

        env:
          JOB_APP_ENV: job-dev # Applicable for all steps

        steps:
          - name: Say Hello
            run: echo "Hello from second workflow!"

          - name: Install
            env:
              APP_ENV: demo
              DB_PASSWORD: ${{secrets.DB_PASSWORD}}
            run: echo "Environment $APP_ENV using $DB_PASSWORD, $JOB_APP_ENV, $GLOBAL_APP_ENV"
          
          - name: Create Demo File
            run: 
              echo "Hello from CI Pipeline!" > demo.txt
              echo "File created successfully."  
          - name: Upload Demo # Test reports and logs to be saved because machine will deleted, we are uploading the demo file to artifacts
            uses: actions/upload-artifact@v4
            with:
              name: build-artifacts-demo
              path: .    
         
    test:
        runs-on: ubuntu-latest
        needs: build #Run this job after build job is completed
        steps:
          - name: Test Job
            run: echo "Testing the application"
