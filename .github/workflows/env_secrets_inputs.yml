name: Demo CI Env Secrets

on:
  push:
    branches: [ "dev" ]

  workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Say Hello
            run: echo "Hello from second workflow!"

          - name: Install
            env:
              APP_ENV: demo
              DB_PASSWORD: ${{secrets.DB_PASSWORD}}
            run: echo "Environment $APP_ENV using $DB_PASSWORD"   
         

